version: "3.8"
services:
  superglue:
    build:
      context: .
      dockerfile: Dockerfile
    image: superglue:gpu
    volumes:
      - ./:/workspace:cached
    working_dir: /workspace
    command: python match_pairs.py
    environment:
      - NVIDIA_VISIBLE_DEVICES=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # If your Docker Engine requires the legacy key, uncomment:
    # runtime: nvidia
